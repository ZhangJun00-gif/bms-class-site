server {
  listen 80 default_server;
  server_name ${INTRANET_HOST};
  return 308 https://${INTRANET_HOST}$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name ${INTRANET_HOST};
  ssl_certificate /run/secrets/tls/fullchain.pem;
  ssl_certificate_key /run/secrets/tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_tickets off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 210m;
  client_body_timeout 600s;
  server_tokens off;
  access_log off;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

  location = /api/docs { return 404; }
  location ^~ /api/docs/ { return 404; }
  location = /api/docs-json { return 404; }
  location = /api/docs-yaml { return 404; }
  location ~ /\. { return 404; }
  location ~* \.map$ { return 404; }

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
  }
  location / { try_files $uri $uri/ /index.html; }
  location ~* \.(?:js|css|png|jpg|jpeg|webp|svg|woff2)$ {
    expires 7d;
    try_files $uri =404;
  }
}
